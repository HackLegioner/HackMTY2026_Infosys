services:
  python-agents:
    build:
      context: ./python-agents
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    volumes:
      - ./python-agents:/app
    restart: unless-stopped

  osrm:
    image: osrm/osrm-backend:latest
    ports:
      - "5000:5000"
    volumes:
      - ./data/osrm:/data
    command: osrm-routed --algorithm mld /data/monterrey.osrm
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=courier-ai
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
