services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deliman-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PYTHON_AGENT_URL=http://python-agents:8001
      - MONGODB_URI=mongodb://mongo:27017/courier-ai
    depends_on:
      - python-agents
      - mongo
    restart: unless-stopped

  python-agents:
    build:
      context: ./python-agents
      dockerfile: Dockerfile
    container_name: deliman-python-agents
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    volumes:
      - ./python-agents:/app
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: deliman-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=courier-ai
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  osrm:
    image: osrm/osrm-backend:latest
    container_name: deliman-osrm
    ports:
      - "5000:5000"
    volumes:
      - ./data/osrm:/data
    command: osrm-routed --algorithm mld /data/monterrey.osrm
    restart: unless-stopped
    profiles:
      - with-osrm

volumes:
  mongo_data:
